---
- name: Install Nginx and configure Cowsay page
  hosts: all
  become: true

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Install cowsay package
      ansible.builtin.apt:
        name: cowsay
        state: present

    - name: Run cowsay with server name
      ansible.builtin.command: "/usr/games/cowsay 'This is server {{ inventory_hostname }}!'"
      register: cowsay_result

    - name: Deploy HTML page from template
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
